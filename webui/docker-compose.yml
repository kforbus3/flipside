# Web management UI for Debian A/B Images.
#
# Run it from this directory (`cd webui && docker compose up -d --build`) so the
# `..` bind mount below resolves to the repository root. The UI reads the repo at
# /project and starts the builder/imager/server as sibling containers through the
# Docker socket; it discovers the repo's host-side path from its own mount, so no
# path configuration is needed. HOST_PROJECT_DIR only overrides that discovery —
# set it in webui/.env if you run compose from somewhere else.
#
# The UI does NOT hold the Docker socket. It talks to the proxy below, which
# passes an allowlist of the calls this project actually makes and refuses the
# rest — `exec` into other containers, arbitrary images, host bind mounts. See
# ../dockerproxy/proxy.py, which is short and is meant to be read.
#
# To go back to the raw socket (if the allowlist ever refuses something a build
# legitimately needs — please open an issue if so), set in webui/.env:
#   DOCKER_HOST=unix:///var/run/docker.sock
# and mount the socket into the webui service.
services:
  dockerproxy:
    build: ../dockerproxy
    image: debian-ab-dockerproxy
    container_name: debian-ab-dockerproxy
    restart: unless-stopped
    environment:
      # Where the project lives on the host, which bounds what may be
      # bind-mounted into a build. Left empty it is discovered from the webui
      # container's own /project mount, so the two cannot disagree.
      - HOST_PROJECT_DIR=${HOST_PROJECT_DIR:-}
      - LOG_LEVEL=${PROXY_LOG_LEVEL:-INFO}
    volumes:
      # Not :ro. A read-only bind of a unix socket restricts nothing about what
      # can be done through it — the confinement is the allowlist in the proxy,
      # and pretending otherwise would be decoration.
      - /var/run/docker.sock:/var/run/docker.sock
      - dockerproxy:/shared
    # It connects to one socket and listens on another. Nothing else.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
  webui:
    build: .
    image: debian-ab-webui
    container_name: debian-ab-webui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in webui/.env}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in webui/.env (long random string)}
      - HOST_PROJECT_DIR=${HOST_PROJECT_DIR:-}
      - PROJECT_DIR=/project
      # Optional: a secrets-manager token for storing generated LUKS passphrases.
      # Set here (via webui/.env) it stays out of the app's own config file on
      # disk, and takes precedence over a token saved through the UI.
      - BAO_TOKEN=${BAO_TOKEN:-}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
      # Optional: OIDC single sign-on — off unless issuer + client id are set.
      # See webui/.env.example and docs/WEBUI.md "Single sign-on (OIDC)".
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_ROLE_CLAIM=${OIDC_ROLE_CLAIM:-groups}
      - OIDC_ROLE_MAP=${OIDC_ROLE_MAP:-}
      - OIDC_DEFAULT_ROLE=${OIDC_DEFAULT_ROLE:-deny}
      - OIDC_DISPLAY_NAME=${OIDC_DISPLAY_NAME:-Single sign-on}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email}
      # Fleet control plane. CONTROL_URL normally comes from server/.env (the
      # Provisioning page writes it there); set it here only to override that.
      - CONTROL_URL=${CONTROL_URL:-}
      - AGENT_INTERVAL=${AGENT_INTERVAL:-300}
      - AGENT_TOKEN=${AGENT_TOKEN:-}
      # Observability. All optional and all off by default.
      - LOG_JSON=${LOG_JSON:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - METRICS_PUBLIC=${METRICS_PUBLIC:-false}
      - AUDIT_SYSLOG=${AUDIT_SYSLOG:-}
      - AUDIT_SYSLOG_HOSTNAME=${AUDIT_SYSLOG_HOSTNAME:-}
      - AUDIT_HTTP_URL=${AUDIT_HTTP_URL:-}
      - AUDIT_HTTP_TOKEN=${AUDIT_HTTP_TOKEN:-}
      # The allowlisting proxy, not the daemon. Override in webui/.env only to
      # fall back to the raw socket.
      - DOCKER_HOST=${DOCKER_HOST:-unix:///shared/docker.sock}
    depends_on:
      - dockerproxy
    volumes:
      - dockerproxy:/shared
      - ${HOST_PROJECT_DIR:-..}:/project

volumes:
  # Carries only the proxy's listening socket between the two containers.
  dockerproxy:
