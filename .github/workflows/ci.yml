name: CI

# Fast checks on every push, and the slow boot tests once a night.
#
# The split is deliberate. Everything in `checks` runs in about a minute and
# catches the class of bug that has actually bitten this project: a router
# imported but never mounted, so its endpoints 404 while the frontend still
# typechecks clean; a shell script whose quoting breaks only under bash; an
# initramfs script that is not valid POSIX sh. The boot tests catch the rest,
# but they need privileges, loop devices and several minutes per boot, which is
# the wrong trade for every push.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"      # nightly boot tests
  workflow_dispatch:

# Nothing here writes to the repository; the default token grants far more.
permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          fail=0
          # Two parsers on purpose: the initramfs and container entrypoints run
          # under dash, and constructs bash accepts are not always POSIX (and
          # vice versa -- an apostrophe inside ${VAR:?...} parses under dash and
          # not under bash, which is how one shipped unnoticed).
          while IFS= read -r f; do
            head -1 "$f" | grep -q 'bin/bash' && parser=bash || parser=sh
            "$parser" -n "$f" || { echo "::error file=$f::$parser -n failed"; fail=1; }
          done < <(find . -name '*.sh' -not -path './node_modules/*' \
                          -o -path './imager/init' \
                          -o -path './builder/overlay/etc/initramfs-tools/*' -type f)
          exit $fail

      - name: No command substitution inside the chroot heredoc
        run: |
          # build-image.sh writes the in-chroot script with an UNQUOTED heredoc,
          # so ${...} interpolates the builder's variables on purpose -- and
          # backticks or $(...) execute in the builder, which is never intended.
          # A pair of backticks around a package name in a comment once ran that
          # package name as a command and broke the build.
          awk '/^cat > "\$MNT\/tmp\/setup.sh" <<CHROOT$/{h=1;next} h&&/^CHROOT$/{h=0} h' \
            builder/build-image.sh > /tmp/heredoc.txt
          if [ ! -s /tmp/heredoc.txt ]; then
            echo "::error::could not find the chroot heredoc — has it been renamed?"; exit 1
          fi
          if grep -n '`' /tmp/heredoc.txt; then
            echo "::error::backticks inside the unquoted chroot heredoc execute in the builder"; exit 1
          fi
          if grep -nE '\$\(' /tmp/heredoc.txt; then
            echo "::error::\$( ) inside the unquoted chroot heredoc executes in the builder"; exit 1
          fi

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Advisory: this is a large existing codebase and the point is to stop
          # new problems, not to gate on a backlog of style findings.
          find . -name '*.sh' -not -path './node_modules/*' -print0 \
            | xargs -0 shellcheck -S error || true

      - name: Frontend typecheck and build
        working-directory: webui/frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build

      - name: Where a folder upload puts its files
        working-directory: webui/frontend
        run: |
          # The one place a path chosen in a browser becomes a destination for a
          # write endpoint. The server refuses anything escaping overlay.d
          # regardless, so this is about the mapping being right -- a folder
          # landing one directory off is found by a machine behaving oddly
          # rather than by an error. Plain node; the frontend has no test runner
          # and adding one for two pure functions is the worse trade.
          npx esbuild src/lib/overlayUpload.ts --format=esm \
            --outfile=src/lib/overlayUpload.built.mjs --log-level=error
          node src/lib/overlayUpload.test.mjs

      - name: Backend imports and routes
        working-directory: webui/backend
        run: |
          python -m pip install -q -r requirements.txt httpx
          python - <<'PY'
          import os, pkgutil, sys, tempfile
          # PROJECT_DIR defaults to /project, the path the repo is mounted at
          # inside the web UI container. On a runner that does not exist and is
          # not creatable, and the first endpoint that writes under it dies with
          # "PermissionError: /project". Point it at a scratch directory.
          os.environ.setdefault("PROJECT_DIR", tempfile.mkdtemp())
          os.makedirs(os.path.join(os.environ["PROJECT_DIR"], "output"), exist_ok=True)
          os.environ.setdefault("STATIC_DIR", "/tmp/none")
          os.environ.setdefault("ADMIN_PASSWORD", "ci")
          os.environ.setdefault("SECRET_KEY", "ci-secret-key-not-used-anywhere")
          from fastapi.testclient import TestClient
          from app.main import app
          from app import routers

          client = TestClient(app)
          # Routes included via include_router used to appear flattened in
          # app.routes; FastAPI 0.141 nests them inside _IncludedRouter
          # objects, which have no .path and no .routes -- they hold the
          # original router and the prefix it was mounted under. Unioning
          # app.routes with the OpenAPI schema covered that for a while, but
          # the schema omits include_in_schema=False routes, so /api/metrics
          # -- mounted and working -- reported as a router that had never been
          # mounted at all. Walk the real structure instead.
          def walk(routes):
              for r in routes:
                  p = getattr(r, "path", None)
                  if p:
                      yield p
                  yield from walk(getattr(r, "routes", []) or [])
                  original = getattr(r, "original_router", None)
                  if original is not None:
                      ctx = getattr(r, "include_context", None)
                      prefix = getattr(ctx, "prefix", "") if ctx is not None else ""
                      for sub in getattr(original, "routes", []):
                          sp = getattr(sub, "path", None)
                          if sp:
                              yield prefix + sp

          paths = set(walk(app.routes))
          # Belt and braces: if a future FastAPI changes the internals again the
          # schema still carries every documented path, so this degrades to its
          # old coverage rather than to a false failure on every hidden route.
          paths |= set(app.openapi().get("paths", {}))

          # Every router module must actually be mounted. A router that is
          # imported but left out of the app answers 404 with a body that reads
          # like a legitimate "not found", which is indistinguishable from a
          # working endpoint returning nothing -- it shipped once already.
          missing = []
          for m in pkgutil.iter_modules(routers.__path__):
              mod = __import__(f"app.routers.{m.name}", fromlist=["router"])
              r = getattr(mod, "router", None)
              if r is None:
                  continue
              for route in r.routes:
                  if "/api" + route.path not in paths:
                      missing.append(f"{m.name}: {route.path}")
          if missing:
              print("Routers not mounted:", *missing, sep="\n  ")
              sys.exit(1)

          assert client.get("/api/health").status_code == 200, "health check failed"
          # Endpoints that take reports from machines are deliberately open;
          # everything else must refuse an unauthenticated caller.
          for path in ("/api/imaging", "/api/deployments", "/api/images", "/api/bundles"):
              code = client.get(path).status_code
              assert code == 401, f"{path} returned {code}, expected 401"
          r = client.post("/api/imaging/report", data={"id": "aa:bb:cc:dd:ee:ff", "phase": "writing"})
          assert r.status_code == 200, f"imager report rejected: {r.status_code}"
          r = client.post("/api/imaging/checkin", data={"id": "aa:bb:cc:dd:ee:ff"})
          assert r.status_code == 200, f"checkin rejected: {r.status_code}"
          print(f"OK: {len(paths)} API routes, all routers mounted")
          PY

      - name: Named users, roles, sessions and API tokens
        working-directory: webui/backend
        run: |
          # The compatibility contract (admin + ADMIN_PASSWORD keeps working,
          # hashed, and is never resynced from the env once users.json exists),
          # the full role matrix over the real app, immediate session/token
          # revocation, and the last-admin guard. Every failure here has a
          # quiet production shape -- a viewer who can start builds looks
          # exactly like a working UI.
          python tests/test_identity.py

      - name: Metrics, structured logs, and shipping the audit trail
        working-directory: webui/backend
        run: |
          # Three failures that all look like success. Metric labels built from
          # user data mint one time series per machine and take down the
          # Prometheus scraping them a week later. A JSON log line that is not
          # JSON, or a traceback split over forty lines, reaches the collector
          # as forty unparseable events. And an audit forwarder that blocks
          # wedges every mutating API call behind a wedged SIEM -- tested here
          # against a collector that *hangs* rather than one that refuses,
          # because a refused connection returns instantly and would pass
          # whether the forwarder were asynchronous or not.
          python tests/test_observability.py

      - name: SBOMs parse, and the search tells "no matches" from "nothing to match"
        working-directory: webui/backend
        run: |
          # Runs the real make-sbom.sh against a fake dpkg database. The
          # documents are generated by awk, so the failure mode is a stray comma
          # that surfaces in somebody else's scanner rather than here. The
          # search half distinguishes "nothing matched" from "nothing has an
          # SBOM" -- identical-looking answers that mean opposite things, and
          # this question is only ever asked when there is no time to check.
          python tests/test_sbom.py

      - name: The rollout engine decides from what machines actually report
        working-directory: webui/backend
        run: |
          # Drives the real heartbeat endpoint one machine at a time, because
          # every failure here is silent and fleet-wide. The load-bearing one:
          # a machine that says an install finished is NOT a success -- it is
          # still on the old version until it comes back on the new one, which
          # is exactly what a bundle that installs and then fails to boot looks
          # like. An engine that counted the install would walk a bricking
          # update across the whole fleet while every machine rolled back.
          python tests/test_fleet_rollout.py

      - name: The agent installs what it is offered, exactly once
        run: |
          # The machine half, running the real ab-agent.sh against a stub
          # server. Covers the parsing of a directive, remembering which server
          # it was moved to, and not reinstalling the same bundle on every beat
          # -- which on a five-minute timer is a machine that never stops
          # downloading.
          ./scripts/test-fleet-agent.sh

      - name: Every change leaves an audit line
        working-directory: webui/backend
        run: |
          # Mutations are audited by middleware (so a new router is covered
          # the day it exists), failed logins keep the username and never the
          # password, the LUKS reveal GET is recorded, and the log trims
          # itself rather than filling the disk the builds need.
          python tests/test_audit.py

      - name: OIDC single sign-on
        working-directory: webui/backend
        run: |
          # Runs against a fake IdP in-process: real discovery, JWKS, PKCE
          # code exchange and a signed ID token through the real app. Mostly
          # it asserts refusals -- forged state, wrong nonce, wrong key,
          # expired token, unmapped groups, and an IdP username colliding
          # with a local account -- because an SSO bug's production shape is
          # a stranger holding a session, not an error message.
          python tests/test_oidc.py

      - name: Secrets-manager integration
        working-directory: webui/backend
        run: |
          # Runs against a fake KV v2 server in-process. The assertion that
          # matters is ordering: an encrypted build must file its passphrase
          # before it starts, and must not start at all if the store refuses it.
          # Nothing about that is visible until someone needs the recovery key.
          python tests/test_secretstore.py

      - name: A build never replaces an existing image
        working-directory: webui/backend
        run: |
          # The output name was distro-suite-arch alone, so a second Debian 13
          # amd64 build replaced the first -- the image a deployed machine was
          # made from, its sidecars, and the LUKS passphrase filed under that
          # name, which is a recovery key for a machine in the field. Silently.
          python tests/test_image_naming.py

      - name: Build profiles reach the builder, bad combos never reach a job
        working-directory: webui/backend
        run: |
          # A request that never mentions a profile must produce exactly the
          # build command it always has, and a desktop the distro does not
          # package (cinnamon on Ubuntu) must be a 400 naming the available
          # ones -- before a job exists, not twenty minutes into a build.
          python tests/test_build_profiles.py

      - name: The builder refuses bad profile combos before doing any work
        run: |
          # Same refusals from build-image.sh itself, at argument-parse time:
          # unprivileged, no Docker, and every case must leave its working
          # directory empty -- a refusal that has already allocated something
          # is validation that moved later than it claims.
          bash scripts/test-profile-args.sh

      - name: SPA routing
        working-directory: webui/backend
        run: |
          # The catch-all used to answer 200 + index.html for any unknown path,
          # including /bundles/*.raucb. A machine pointed at this port streamed
          # the React app into rauc, which read "</html>\n" as the bundle's
          # signature size and reported a corrupt bundle. A 404 is free.
          python tests/test_spa_routing.py

      - name: Deleting a bundle keeps the `latest` pointer true
        working-directory: webui/backend
        run: |
          # `ab-update` with no arguments installs whatever bundles/latest
          # names, and directory listing is off -- so a delete that removes the
          # file and leaves the pointer breaks every unattended machine at once,
          # as a 404 that reports itself as a bad bundle rather than a missing
          # one. These assert the pointer always names a file that exists.
          python tests/test_bundle_delete.py

      - name: A machine's assigned name reaches the kernel command line
        working-directory: webui/backend
        run: |
          # An image cannot carry a hostname, so the name is assigned per MAC
          # and travels on the kernel command line. A space in it would split
          # into a second parameter, and a sanitised name would mean the UI and
          # the machine disagree -- so names are refused, not corrected.
          python tests/test_assignment_hostname.py

      - name: A per-machine iPXE script boots the right imager
        working-directory: webui/backend
        run: |
          # The generated per-machine script had drifted from the fallback
          # template: it hardcoded the amd64 imager and guarded neither fetch,
          # so an arm64 machine WITH an assignment got an imager it cannot run
          # while the same machine unassigned booted fine. The failure is a
          # kernel panic that names nothing.
          python tests/test_host_script_arch.py

      - name: The imager is published whole, or not at all
        run: |
          # The pack used to redirect straight onto the artifact the PXE server
          # is serving, truncating it for the several minutes the module tree
          # takes. A machine netbooting during a rebuild got a complete kernel
          # and a half-written initramfs, found no /init, and panicked -- with
          # nothing in the build output to say so, because the file was whole
          # again by the time anyone looked.
          ./scripts/test-imager-publish.sh

      - name: Overlay file management
        working-directory: webui/backend
        run: |
          # These paths come from a browser and end up at open(). Most of what
          # this asserts is refusal: `..` segments, absolute paths that escape
          # on join, and symlinked directories pointing out of the tree.
          python tests/test_overlay.py

      - name: State-manifest engine
        run: |
          # The initramfs script, run for real against a loopback ext4 partition
          # with /proc/cmdline faked per case. It belongs in the fast job rather
          # than with the boot tests: it is the highest-risk code in the project
          # -- it runs before there is anything to log into, and twice now a bug
          # in it has looked exactly like success -- and it finishes in about a
          # minute, which the boot tests do not.
          docker run --rm --privileged -v "$PWD":/repo:ro ubuntu:24.04 \
            bash /repo/scripts/test-state-directives.sh | tee state.log
          grep -q "failed: 0" state.log || { echo "::error::state-manifest engine failed"; exit 1; }

      - name: LUKS bootstrap key comes from the machine, not the image
        run: |
          # Both bugs that made encrypted updates impossible lived in this one
          # mechanism, both were found by imaging a real machine rather than by
          # CI, and both were invisible until a second boot: crypttab naming the
          # build's own LUKS UUIDs, and the keyfile being baked into the
          # initramfs. Real loop device, real GPT, real LUKS, the real
          # init-premount script -- about a minute, against 50 for the boot
          # tests, which were not watching this at all.
          docker run --rm --privileged -v "$PWD":/repo:ro ubuntu:24.04 \
            bash /repo/scripts/test-luks-key-portability.sh | tee luks.log
          grep -q "failed: 0" luks.log || { echo "::error::LUKS key portability regressed"; exit 1; }

      - name: ab-update falls back and diagnoses correctly
        run: |
          # The real update test builds two 8 GiB images and boots them, so it
          # only runs nightly -- and the streaming fallback stayed broken for a
          # week because that was the only thing watching it. This stubs rauc
          # and curl and checks the same logic in about a second.
          bash scripts/test-ab-update.sh | tee abu.log
          grep -q "ALL PASS" abu.log || { echo "::error::ab-update fallback/diagnostics regressed"; exit 1; }

      - name: A machine being imaged can reach the endpoint it reports into
        run: |
          # The imager posts progress to <image host>/api/imaging/report, and
          # the provisioning nginx had no /api/ route at all -- so every report
          # 404'd into the static file root. Reporting is best-effort and
          # silent, so a whole deployment imaged perfectly and never appeared on
          # the Imaging page, with nothing anywhere saying why. Also asserts the
          # admin API is NOT published to the imaging segment, which a prefix
          # proxy over /api/ would have done.
          bash scripts/test-imaging-report-route.sh | tee route.log
          grep -q "failed: 0" route.log \
            || { echo "::error::the imaging report route regressed"; exit 1; }

      - name: Provisioning config renders for every architecture
        run: |
          # dnsmasq must hand an arm64 machine an arm64 bootloader; getting this
          # wrong is silent, and shows up as a machine that PXE-boots to nothing.
          docker build -t ci-dnsmasq server/dnsmasq
          docker run --rm -e SERVER_IP=10.0.0.1 -e MODE=dhcp -e INTERFACE=eth0 \
            -e DHCP_RANGE_START=10.0.0.10 -e DHCP_RANGE_END=10.0.0.99 \
            --entrypoint sh ci-dnsmasq -c 'ls /srv/tftp' | tee /tmp/tftp.txt
          for f in undionly.kpxe ipxe.efi ipxe-arm64.efi; do
            grep -qx "$f" /tmp/tftp.txt || { echo "::error::$f missing from the TFTP root"; exit 1; }
          done

  boot-tests:
    name: Boot tests
    # Only nightly or on request: each of these builds a real image and boots it
    # under QEMU. On an x86_64 runner the amd64 build is native, so this is far
    # faster here than on a developer's arm64 laptop.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Generous on purpose. 90 was enough only while the slot-stability step
    # failed fast; a suite that actually reaches the encrypted cross-build
    # runs well past it, and a timeout reports as "cancelled" with no
    # annotation anywhere near the step that was running -- two full runs
    # were written off as mystery cancellations before the number was found.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the runner
        run: |
          # The suite builds two full images and boots a dozen scratch disks.
          # The stock runner image donates ~30 GB of toolchains nothing here
          # uses -- and the 2026-08-16 run died at "Each state model boots"
          # with "No space left on device", the runner unable to write even
          # its own diagnostic log. The tests now also remove their scratch
          # disks on exit; this reclaims the rest of the headroom.
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Build an image
        run: |
          ./builder/run.sh --arch amd64 --distro debian --suite trixie \
            --hostname ci --username ci --password ci --image-size 8 \
            --compress none --encrypt --unlock keyfile --luks-passphrase testluks \
            --output /output/ovl-test.img

      - name: Root overlay boots and /home gets the whole disk
        run: |
          docker run --rm --privileged -v "$PWD/output":/output -v "$PWD/scripts":/s \
            --entrypoint bash debian-ab-builder:amd64 /s/test-overlay-boot.sh | tee boot.log
          grep -q "root-fstype: overlay" boot.log || { echo "::error::root is not an overlay"; exit 1; }

      - name: The imager applies what the iPXE script tells it
        run: |
          # This test existed and was never wired in, which is how the one
          # unwatched hop -- iPXE argument -> imager -> /boot/ab-deploy.json --
          # shipped broken. An imager silently ignores parameters it does not
          # understand, so the machine images perfectly and comes up with the
          # wrong name; it reads as the web UI dropping the field. The imager
          # here is built from this checkout, so it also catches a parameter
          # added to the generated scripts but not to init.
          ./imager/run.sh
          docker run --rm --privileged -v "$PWD/output":/output -v "$PWD/scripts":/s \
            -e IMAGE_FILE=ovl-test.img -e ASSIGNED_HOSTNAME=e2e-assigned \
            --entrypoint bash debian-ab-builder:amd64 /s/test-imager-e2e.sh | tee e2e.log
          grep -q "ALL PASS" e2e.log \
            || { echo "::error::the imager did not apply the assigned hostname"; exit 1; }

      - name: A healthy machine keeps booting the same slot
        run: |
          # The gap nothing watched. grub.cfg arms a one-shot fallback every
          # boot and ab-mark-good disarms it; ordered After=multi-user.target it
          # ran ~90s in, while the login prompt appeared at ~38s. Anyone who
          # logged in and rebooted in between came back up on the *other slot*
          # with none of their changes -- which reads as the machine reverting
          # itself. Three modes: settle-then-poweroff, the reported
          # hostname-then-reboot, and a reboot 45s in, which is what a person
          # actually does and what used to fail.
          # rollback is the counterweight: arming the counter only for updates
          # must not quietly remove the fallback. It stages what an update
          # stages, makes the new slot unhealthy, and asserts B -> A.
          # health-fail proves the health-check gate is not decorative. It
          # shipped once as WantedBy=boot-complete.target, which is a Wants=
          # -- a failing check left the target `active`, the slot was blessed
          # anyway and nothing rolled back. Only a boot showed that.
          # assigned-name proves the other half: the name the imager leaves on
          # the BOOT partition is actually applied, and survives a reboot rather
          # than being set once in memory.
          for mode in poweroff early-reboot rollback health-fail assigned-name; do
            docker run --rm --privileged -v "$PWD/output":/output -v "$PWD/scripts":/s \
              -e SRC=/output/ovl-test.img -e ARCH=amd64 -e "MODE=$mode" -e BOOT_TIMEOUT=600 \
              --entrypoint bash debian-ab-builder:amd64 /s/test-slot-stability.sh \
              | tee "slot-$mode.log"
            grep -q "failed: 0" "slot-$mode.log" \
              || { echo "::error::slot stability regressed ($mode)"; exit 1; }
          done

      - name: Recovery resets the overlay without destroying it
        run: |
          docker run --rm --privileged -v "$PWD/output":/output -v "$PWD/scripts":/s \
            --entrypoint bash debian-ab-builder:amd64 /s/test-overlay-recovery.sh | tee rec.log
          grep -q "set aside" rec.log || { echo "::error::reset did not run"; exit 1; }
          grep -q "prev-added:   present" rec.log || { echo "::error::reset destroyed the old upper layer"; exit 1; }

      - name: An update bundle installs and the machine boots the other slot
        run: |
          ./builder/run.sh --arch amd64 --distro debian --suite trixie \
            --hostname bundlesrc --username ci --password ci --image-size 8 \
            --compress none --output /output/bundle-src.img
          docker run --rm --privileged -v "$PWD/output":/output \
            --entrypoint /build/make-bundle.sh debian-ab-builder:amd64 \
            --image /output/bundle-src.img --version ci
          # A separate build on purpose. The two images share nothing but the
          # signing certificate, which build-image.sh generates on the first
          # build and every later one trusts -- so this also asserts that an
          # update needs no certificate copied to the machine by hand.
          ./builder/run.sh --arch amd64 --distro debian --suite trixie \
            --hostname updtest --username ci --password ci --image-size 8 \
            --compress none --output /output/upd-test.img
          docker run --rm --privileged -v "$PWD/output":/output -v "$PWD/scripts":/s \
            --entrypoint bash debian-ab-builder:amd64 /s/test-update-bundle.sh | tee upd.log
          grep -q "PASS:" upd.log || { echo "::error::update did not complete"; exit 1; }

      - name: The same, encrypted, across two independent builds
        run: |
          # The case that was broken from the start and that nothing tested.
          # Two builds mean two luksFormat runs and two sets of LUKS UUIDs; the
          # image used to bake its own into /etc/crypttab and into the initramfs
          # generated from it, so installing this bundle handed the machine three
          # volumes that exist nowhere on its disk. It waited on all of them
          # forever, showing a blinking cursor and, on a serial console,
          # "Waiting for encrypted source device" -- which reads like an
          # encryption fault rather than a bundle carrying another disk's
          # identity. Volumes are addressed by PARTLABEL now; this is what says
          # so. Bundling from a LUKS image needs the passphrase to read the slot;
          # the bundle it writes is plain and installs on either kind of machine.
          #
          # Reclaim the scratch disks the earlier boots wrote first. Each harness
          # makes its own 32 GiB target and this step adds a fifth image on top
          # of them; the runner has run out of space here before, and it does not
          # fail as "out of space" but as whatever was mid-write at the time.
          rm -f output/*-target.img
          df -h / | tail -1
          ./builder/run.sh --arch amd64 --distro debian --suite trixie \
            --hostname encsrc --username ci --password ci --image-size 8 \
            --compress none --encrypt --unlock keyfile --luks-passphrase testluks \
            --output /output/enc-src.img
          docker run --rm --privileged -v "$PWD/output":/output \
            --entrypoint /build/make-bundle.sh debian-ab-builder:amd64 \
            --image /output/enc-src.img --version ci-enc --luks-passphrase testluks \
            --output /output/bundles/enc-ci.raucb
          ./builder/run.sh --arch amd64 --distro debian --suite trixie \
            --hostname enctarget --username ci --password ci --image-size 8 \
            --compress none --encrypt --unlock keyfile --luks-passphrase testluks \
            --output /output/enc-target.img
          # Before spending 15 minutes on a boot: assert the image carries
          # nothing that belongs to the disk it was built on. Both bugs that
          # made encrypted updates impossible are visible here in seconds, and
          # both were found by imaging a machine instead of by CI.
          docker run --rm --privileged -v "$PWD/output":/output -v "$PWD/scripts":/s \
            -e IMAGE=/output/enc-target.img -e LUKS_PASSPHRASE=testluks \
            --entrypoint bash debian-ab-builder:amd64 /s/test-image-portability.sh
          # Then the cross-build question itself, without booting: take the
          # initramfs out of the bundle, run it against the *other* image's
          # disk, and check it unlocks. Both bugs that broke encrypted updates
          # fail here in seconds, with the reason, instead of fifteen minutes
          # later as a timeout.
          docker run --rm --privileged -v "$PWD/output":/output -v "$PWD/scripts":/s \
            -e MACHINE=/output/enc-target.img -e SOURCE=/output/enc-src.img \
            -e BUNDLE=/output/bundles/enc-ci.raucb -e LUKS_PASSPHRASE=testluks \
            --entrypoint bash debian-ab-builder:amd64 /s/test-cross-build-update.sh
          docker run --rm --privileged -v "$PWD/output":/output -v "$PWD/scripts":/s \
            -e TAG=enc -e SRC=/output/enc-target.img \
            -e BUNDLE=/output/bundles/enc-ci.raucb \
            -e DISK=/output/enc-update-target.img \
            -e LUKS_PASSPHRASE=testluks \
            --entrypoint bash debian-ab-builder:amd64 /s/test-update-bundle.sh | tee enc-upd.log
          grep -q "PASS:" enc-upd.log || { echo "::error::encrypted update did not complete"; exit 1; }

      - name: Every image trusts the signing certificate without being told to
        run: |
          # The failure this prevents is not visible until months later: an image
          # built before any key existed shipped a keyring it could not use, and
          # the bundle sent to it much later failed with "Verify error:
          # self-signed certificate" -- which reads as a bad bundle. Nothing can
          # repair that machine remotely, because the update is the thing it will
          # not accept. So assert the property at build time, on every image.
          want=$(openssl x509 -in output/rauc-keys/cert.pem -noout -fingerprint -sha256 | sed 's/.*=//')
          echo "signing cert: $want"
          fail=0
          for j in output/*.img.json; do
            got=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('update_keyring_sha256',''))" "$j")
            name=$(basename "$j" .json)
            if [ "$got" = "$want" ]; then
              echo "  ok   $name"
            else
              echo "::error::$name trusts '${got:-nothing}', not the signing certificate"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

      - name: Image-owned files override the machine
        run: |
          # The fixture here is not arbitrary: test-image-customization.sh greps
          # for corp-fileserver, /etc/netplan/10-corp.yaml and
          # /etc/ab-custom-marker by name. It shipped only an /etc/hosts naming
          # a different host and no --run-script at all, so three of its
          # assertions could never pass. Nobody saw it, because the update step
          # above failed first and this one never ran.
          mkdir -p overlay.d/etc/netplan
          printf '127.0.0.1 localhost\n10.0.2.50 corp-fileserver\n' > overlay.d/etc/hosts
          printf 'network:\n  version: 2\n  renderer: networkd\n' > overlay.d/etc/netplan/10-corp.yaml
          # Deliberately NOT in overlay.d: everything there is copied into the
          # image and recorded as image-owned, and a build script is not part of
          # the image. /output is mounted into the builder, so it is reachable.
          printf '#!/bin/sh\ntouch /etc/ab-custom-marker\n' > output/custom.sh
          chmod +x output/custom.sh
          ./builder/run.sh --arch amd64 --distro debian --suite trixie \
            --hostname customtest --username ci --password ci --image-size 8 \
            --compress none --own-path /etc/resolv.conf \
            --run-script /output/custom.sh --output /output/custom-test.img
          docker run --rm --privileged -v "$PWD/output":/output -v "$PWD/scripts":/s \
            --entrypoint bash debian-ab-builder:amd64 /s/test-image-customization.sh | tee custom.log
          grep -q "PASS:" custom.log || { echo "::error::image-owned override failed"; exit 1; }
          # Leave overlay.d as it was found: the next step builds three more
          # images from this workspace and must not inherit this fixture.
          rm -rf overlay.d/etc

      - name: Each state model boots and lays out what its manifest says
        run: |
          # One build per model, because the models differ in whether the root
          # slot is writable at all -- which nothing short of a real boot with
          # systemd on it can confirm.
          for model in overlay stateful appliance; do
            ./builder/run.sh --arch amd64 --distro debian --suite trixie \
              --hostname "sm-$model" --username ci --password ci --image-size 8 \
              --compress none --state-model "$model" \
              --slot-private /var/lib/docker --volatile /var/tmp:128M \
              --output "/output/sm-$model.img"
            docker run --rm --privileged -v "$PWD/output":/output -v "$PWD/scripts":/s \
              -e "SRC=/output/sm-$model.img" -e BOOT_TIMEOUT=600 \
              --entrypoint bash debian-ab-builder:amd64 /s/test-state-model.sh \
              | tee "sm-$model.log"
            grep -q "failed: 0" "sm-$model.log" \
              || { echo "::error::state model $model did not boot as its manifest describes"; exit 1; }
          done

      - name: A per-slot upper layer really does keep the slots apart
        run: |
          # The container harness proves the engine picks the right directory.
          # Only a real boot proves the result is a system that comes up on
          # both slots -- an empty upper-B is a slot that has never run, which
          # is the one case where "it booted" is not a given. --persist /home
          # is in here because it is the combination the docs recommend, and
          # the harness asserts that /home still crosses while the root does not.
          rm -f output/*-target.img
          ./builder/run.sh --arch amd64 --distro debian --suite trixie \
            --hostname sm-perslot --username ci --password ci --image-size 8 \
            --compress none --slot-private-upper --persist /home \
            --output /output/sm-perslot.img
          docker run --rm --privileged -v "$PWD/output":/output -v "$PWD/scripts":/s \
            -e SRC=/output/sm-perslot.img -e BOOT_TIMEOUT=600 \
            --entrypoint bash debian-ab-builder:amd64 /s/test-state-model.sh \
            | tee sm-perslot.log
          grep -q "failed: 0" sm-perslot.log \
            || { echo "::error::the per-slot upper layer did not behave as its manifest describes"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-logs
          path: |
            boot.log
            rec.log
            state.log
            sm-*.log
            slot-*.log
            output/*.log
